name: Deploy UAT Template

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag
        required: true
        type: string

      repository:
        description: Repository
        required: true
        type: string

jobs:
  deploy:
    name: Deploy UAT
    runs-on: ubuntu-latest

    steps:
      - name: Start UAT deployment
        run: |
          echo "======================================"
          echo "UAT DEPLOYMENT"
          echo "======================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Release Tag: ${{ inputs.release_tag }}"
          echo "======================================"

      - name: Simulate deployment
        run: |
          echo "Deploying to UAT..."
          sleep 10
          echo "UAT deployment completed successfully."
