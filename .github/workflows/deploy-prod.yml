name: Deploy PROD Template

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag
        required: true
        type: string

      repository:
        description: Repository
        required: true
        type: string

jobs:
  deploy:
    name: Deploy PROD
    runs-on: ubuntu-latest

    steps:
      - name: Start PROD deployment
        run: |
          echo "======================================"
          echo "PROD DEPLOYMENT"
          echo "======================================"
          echo "Repository : ${{ inputs.repository }}"
          echo "Release Tag: ${{ inputs.release_tag }}"
          echo "======================================"

      - name: Simulate deployment
        run: |
          echo "Deploying to PROD..."
          sleep 10
          echo "PROD deployment completed successfully."
